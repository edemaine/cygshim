name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore Cygwin package cache
        uses: actions/cache@v5
        with:
          path: D:\cygwin-packages
          # Increment v1 to refresh versions or change the requested packages.
          key: cygwin-packages-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Cygwin tools
        id: cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          work-vol: 'D:'
          packages: |
            git
            texlive-collection-binextra
            texlive-collection-latex

      - name: Build release executables
        shell: pwsh
        run: |
          & "${{ steps.cygwin.outputs.root }}\bin\bash.exe" --noprofile --norc ./build.sh

      - name: Check
        shell: pwsh
        run: |
          & "${{ steps.cygwin.outputs.root }}\bin\bash.exe" --noprofile --norc ./check.sh
